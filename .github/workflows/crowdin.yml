name: Crowdin Localization Sync

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency: "crowdin-upload-${{ github.ref }}"

jobs:
  upload-sources:
    name: Upload Strings to Crowdin
    runs-on: ubuntu-latest
    if: github.repository == 'azoklesoftware/azokle-authenticator'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Synchronize Crowdin Source Strings
        uses: crowdin/github-action@v2
        with:
          upload_sources: true
          upload_translations: false
          download_translations: false
          source: android/app/src/main/res/values/strings.xml
          translation: android/app/src/main/res/values-%android_code%/%original_file_name%
          project_id: "372633"
        env:
          CROWDIN_PROJECT_ID: "372633"
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_TOKEN }}
