name: CodeQL Security Analysis

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    - cron: '25 16 * * 2'
  workflow_dispatch:

jobs:
  analyze:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    if: github.event_name != 'schedule' || github.repository == 'azoklesoftware/azokle-authenticator'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Exclude Specific Importers
        run: |
          find android/app/src/main/java/com/azokle/authenticator/importers ! \( -name AzokleAuthImporter.java -o -name "DatabaseImporter*" \) -type f -exec rm -f {} +
          sed -i '/Importer.class/d' android/app/src/main/java/com/azokle/authenticator/importers/DatabaseImporter.java

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
          cache-dependency-path: 'android/*.gradle*'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: ./android

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java

      - name: Build Debug APK for Analysis
        run: ./gradlew assembleDebug --no-daemon
        working-directory: ./android

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java"
