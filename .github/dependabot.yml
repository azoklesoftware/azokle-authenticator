# Dependabot configuration for Azokle Authenticator
# Configures automated dependency and security updates for Android (Gradle) and related ecosystems

version: 2
updates:
  # 1. Android Gradle Dependencies (Core application)
  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "android"
      - "security"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    # Group dependency updates into logical PRs to minimize noise
    groups:
      android-androidx:
        patterns:
          - "com.android.*"
          - "androidx.*"
      google-libraries:
        patterns:
          - "com.google.*"
      cryptography-security:
        patterns:
          - "org.bouncycastle*"
          - "com.google.crypto.tink*"
          - "net.lingala.zip4j*"
          - "com.nulab-inc:zxcvbn*"
      testing-frameworks:
        patterns:
          - "junit*"
          - "org.mockito*"
          - "androidx.test*"

  # 2. GitHub Actions CI/CD workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "github-actions"
      - "ci"
    commit-message:
      prefix: "chore(ci)"

  # 3. Web Extension npm packages
  - package-ecosystem: "npm"
    directory: "/extension"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "extension"
    commit-message:
      prefix: "chore(extension-deps)"

  # 4. Server Rust Cargo crates
  - package-ecosystem: "cargo"
    directory: "/server"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "server"
    commit-message:
      prefix: "chore(server-deps)"
